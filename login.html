<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | LSPU-SPCC Hackathon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-shell">

    <div class="auth-box">

        <div class="brand center">
            <span class="brand-mark">L</span>

            <div>
                <b>LSPU-SPCC</b>
                <small>HACKATHON 2026</small>
            </div>
        </div>

        <h1>Welcome back.</h1>

        <p class="muted">
            Log in to manage your hackathon registration.
        </p>

        <form id="loginForm">

            <label for="loginEmail">Email</label>
            <input
                id="loginEmail"
                type="email"
                placeholder="student@lspu.edu.ph"
                required
            >

            <label for="loginPassword">Password</label>
            <input
                id="loginPassword"
                type="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="btn btn-full">
                Log In
            </button>

            <p id="loginError" class="login-error"></p>

        </form>

        <div class="demo-note">
            <b>Prototype Login Accounts</b>

            <br><br>

            <strong>Student</strong><br>
            Email: student@lspu.edu.ph<br>
            Password: student123

            <br><br>

            <strong>Admin</strong><br>
            Email: admin@lspu.edu.ph<br>
            Password: admin123
        </div>

        <p class="switch">
            New participant?
            <a href="register.html">Create an account</a>
        </p>

    </div>
</div>

<script src="app.js"></script>

</body>
</html>

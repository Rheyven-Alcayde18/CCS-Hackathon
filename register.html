<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | LSPU-SPCC Hackathon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-shell">

        <a href="index.html" class="back">
            ← Back to home
        </a>

        <div class="auth-box wide">

            <div class="brand center">

                <span class="brand-mark">L</span>

                <div>
                    <b>LSPU-SPCC</b>
                    <small>HACKATHON 2026</small>
                </div>

            </div>

            <h1>Create your account.</h1>

            <p class="muted">
                Register as a hackathon participant.
            </p>


            <form id="registerForm" class="form-grid">

                <div class="full">

                    <label>Full Name</label>

                    <input
                        id="regName"
                        placeholder="Juan Dela Cruz"
                        required
                    >

                </div>


                <div>

                    <label>Student Number</label>

                    <input
                        id="regStudent"
                        placeholder="2026-00000"
                        required
                    >

                </div>


                <div>

                    <label>Email</label>

                    <input
                        id="regEmail"
                        type="email"
                        placeholder="student@lspu.edu.ph"
                        required
                    >

                </div>


                <div>

                    <label>Course & Section</label>

                    <input
                        id="regCourse"
                        placeholder="BSIT - 2C"
                        required
                    >

                </div>


                <div>

                    <label>Team Name</label>

                    <input
                        id="regTeam"
                        placeholder="Team Innovate"
                        required
                    >

                </div>


                <div class="full">

                    <label>Password</label>

                    <input
                        id="regPassword"
                        type="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="full">

                    <label class="check">

                        <input
                            type="checkbox"
                            required
                        >

                        I agree to the event registration terms.

                    </label>

                </div>


                <div class="full">

                    <button
                        type="submit"
                        class="btn btn-full"
                    >
                        Create Account →
                    </button>

                </div>

            </form>


            <p class="switch">

                Already registered?

                <a href="index.html">
                    Log in
                </a>

            </p>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
